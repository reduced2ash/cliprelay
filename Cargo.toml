[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
cliprelay-core = { path = "crates/core" }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "macos-blade", "wayland", "x11", "windows-manifest"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
walkdir = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "native-tls"] }
keyring = { version = "3", features = ["apple-native"] }
trash = "5"
arboard = "3"
urlencoding = "2"
dirs = "5"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rand = "0.8"
parking_lot = "0.12"
smol = "2"

# Local gpui fork: macOS display-link, title-bar drag, and surface-capture
# patches (see vendor/gpui/PATCHES.md). Kept in-tree so a cargo re-download
# cannot lose them.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
