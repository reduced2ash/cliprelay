[package]
name = "cliprelay-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core services for ClipRelay: database, media pipeline, Telegram/X delivery, cleanup."
publish = false

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
walkdir.workspace = true
reqwest.workspace = true
keyring.workspace = true
trash.workspace = true
arboard.workspace = true
urlencoding.workspace = true
dirs.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
rand.workspace = true
parking_lot.workspace = true
grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "fs"] }

[dev-dependencies]
tempfile = "3"
