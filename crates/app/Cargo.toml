[package]
name = "cliprelay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClipRelay — local-first video relay workspace, built with GPUI."
publish = false

[[bin]]
name = "cliprelay"
path = "src/main.rs"

[dependencies]
cliprelay-core.workspace = true
gpui.workspace = true
gpui-video-player = "0.1.2"
gstreamer-video = "0.24"
yuv = "0.8"
smallvec = "1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
flume = "0.12"
smol.workspace = true
image.workspace = true
parking_lot.workspace = true
url = "2"
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
tempfile = "3"
