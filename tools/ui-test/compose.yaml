x-cliprelay-environment: &cliprelay-environment
  DISPLAY: ":99"
  GUI_TEST_SCREEN: "${GUI_TEST_SCREEN:-1440x900x24}"
  GUI_TEST_DPI: "96"
  GUI_TEST_SETTLE_SECONDS: "${GUI_TEST_SETTLE_SECONDS:-3}"
  GUI_TEST_CAPTURE_AFTER: "${GUI_TEST_CAPTURE_AFTER:-35}"
  GUI_TEST_CAPTURE_TALL: "${GUI_TEST_CAPTURE_TALL:-0}"
  GUI_TEST_ONLY_TALL: "${GUI_TEST_ONLY_TALL:-0}"
  GUI_TEST_ONLY_SHELL: "${GUI_TEST_ONLY_SHELL:-0}"
  GUI_TEST_ONLY_STUDIO_SHELL: "${GUI_TEST_ONLY_STUDIO_SHELL:-0}"
  GUI_TEST_STUDIO_SEPARATE_CAPTIONS: "${GUI_TEST_STUDIO_SEPARATE_CAPTIONS:-0}"
  GUI_TEST_STUDIO_TAB: "${GUI_TEST_STUDIO_TAB:-deliver}"
  GUI_TEST_EDIT_DEMO: "${GUI_TEST_EDIT_DEMO:-0}"
  CLIPRELAY_THEME_MODE: "${GUI_TEST_THEME_MODE:-}"
  GUI_TEST_MAX_DIFF_PIXELS: "${GUI_TEST_MAX_DIFF_PIXELS:-0}"
  HOME: /tmp/gui-test-home
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  LIBGL_ALWAYS_SOFTWARE: "1"
  MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
  RUST_BACKTRACE: "1"
  TZ: UTC
  XDG_CACHE_HOME: /tmp/gui-test-home/.cache
  XDG_CONFIG_HOME: /tmp/gui-test-home/.config
  XDG_DATA_HOME: /tmp/gui-test-home/.local/share

x-cliprelay-runtime: &cliprelay-runtime
  image: cliprelay-ui-test:rust-1.96.0-bookworm
  build:
    context: .
    dockerfile: tools/ui-test/Dockerfile
    target: tester
    args:
      RUST_IMAGE: rust:1.96.0-bookworm@sha256:5e2214abe154fe26e39f64488952e5c991eeed1d6d6da7cc8381ae83927f0cfc
      RUNTIME_IMAGE: debian:bookworm-20260803-slim
  user: "${GUI_TEST_UID:-1000}:${GUI_TEST_GID:-1000}"
  environment: *cliprelay-environment
  volumes:
    - type: bind
      source: "${GUI_TEST_ARTIFACT_DIR:-./artifacts/ui-test/latest}"
      target: /artifacts
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
    - /run:rw,nosuid,nodev,size=67108864,mode=0755
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  shm_size: 512m
  init: true
  healthcheck:
    test: ["CMD-SHELL", "xdpyinfo -display $${DISPLAY} >/dev/null 2>&1"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 5s

services:
  ui-test:
    <<: *cliprelay-runtime
    network_mode: none
    command: ["/opt/gui-test/bin/run-smoke.sh"]

  ui-inspect:
    <<: *cliprelay-runtime
    profiles: ["inspect"]
    command: ["/opt/gui-test/bin/start-inspection.sh"]
    environment:
      <<: *cliprelay-environment
      GUI_TEST_VNC_PASSWORD: "${GUI_TEST_VNC_PASSWORD:-}"
    networks: [isolated-inspection]
    ports:
      - "127.0.0.1:${GUI_TEST_NOVNC_PORT:-6080}:6080"
    healthcheck:
      test: ["CMD-SHELL", "xdpyinfo -display $${DISPLAY} >/dev/null 2>&1 && xdotool search --onlyvisible --name '^ClipRelay' >/dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

networks:
  isolated-inspection:
    internal: true
