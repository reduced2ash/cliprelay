[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cliprelay"
version = "0.2.0"
description = "A local-first desktop workflow for selecting, preparing, and relaying video posts."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ClipRelay contributors" }]
keywords = ["video", "telegram", "desktop", "ffmpeg", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "PySide6>=6.8,<6.11",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "qasync>=0.27,<1",
  "send2trash>=1.8,<2",
  "telethon>=1.38,<2",
  "watchdog>=6,<7",
]

[project.urls]
Homepage = "https://github.com/reduced2ash/cliprelay"
Repository = "https://github.com/reduced2ash/cliprelay"
Issues = "https://github.com/reduced2ash/cliprelay/issues"
Changelog = "https://github.com/reduced2ash/cliprelay/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11,<7",
  "pillow>=11,<13",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<7",
]

[project.scripts]
cliprelay = "cliprelay.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cliprelay"]

[tool.hatch.build]
include = [
  "src/cliprelay/**/*.py",
  "src/cliprelay/qml/**/*.qml",
  "src/cliprelay/qml/qmldir",
  "src/cliprelay/assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
