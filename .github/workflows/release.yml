name: Release readiness

# Native GPUI packages must deploy GStreamer correctly on each target. The
# previous tag workflow silently built the unrelated legacy Python/Qt app, so
# releases are manual-only until the native packaging work is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rust-source:
    name: Validate current Rust source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            libfontconfig1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install declared Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0

      - name: Test and build current application
        run: |
          cargo test --workspace --locked
          cargo build --release --locked -p cliprelay

      - name: Explain packaging gate
        run: |
          echo "Rust source validation passed."
          echo "No public artifact was created: macOS and Windows GPUI packages still need verified GStreamer runtime deployment, signing, and launch tests."
